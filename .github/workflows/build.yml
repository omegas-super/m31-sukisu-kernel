name: build-m31

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "stock (no root), ksu (SukiSU builtin), or susfs (SukiSU + SUSFS)"
        required: true
        default: "stock"
        type: choice
        options:
          - stock
          - ksu
          - susfs
      target:
        description: "device target"
        required: true
        default: "m31"
        type: choice
        options:
          - m31
          - m31s
          - a51
          - f41
          - m21
      perf:
        description: "apply M31 Performance Edition tuning (1) or keep stock values (0)"
        # optional so existing dispatch scripts that only pass mode/target keep working;
        # omitted input resolves to the default "0"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      sukisu_sha:
        description: "optional SukiSU builtin commit override (empty = pinned default)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 zip unzip cpio rsync git curl wget \
            device-tree-compiler gcc-aarch64-linux-gnu \
            clang-12 lld-12 llvm-12

      - name: Build
        env:
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          PERF_TUNE: ${{ inputs.perf }}
          SUKISU_SHA: ${{ inputs.sukisu_sha }}
        run: bash scripts/build.sh "$MODE" "$TARGET"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: Everline-AOSP-${{ inputs.target }}-${{ inputs.mode }}${{ inputs.perf == '1' && '-perf' || '' }}
          path: work/kernel/Everline-AOSP_*.zip
          if-no-files-found: error
          retention-days: 14
